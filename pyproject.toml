[project]
name = "outlook-mcp"
version = "1.0.0"
description = "MCP server providing AI assistants access to Microsoft Outlook via Graph API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
auth-server = [
    "flask>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
